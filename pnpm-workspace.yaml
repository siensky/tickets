packages:
  - 'shared/*'
  - 'services/*'
  - 'apps/*'
  - 'tests/e2e'
  - 'tests/system'
allowBuilds:
  esbuild: true
  # Kör bara napi-postinstall (välja rätt förkompilerad binär för
  # plattformen) — samma mönster och förtroendenivå som esbuild ovan.
  # Krävs av eslint-import-resolver-typescript (eslint.config.js), inte
  # av applikationskoden. Se docs/forsvar.md "Varför behöver
  # eslint-plugin-boundaries en TypeScript-resolver?".
  unrs-resolver: true
  # Transitiva beroenden till `testcontainers` (docs/rules.md §8: riktiga
  # Postgres/RabbitMQ-containrar i integrationstester, inga mockar).
  # ssh2 + cpu-features används för att prata med en Docker-daemon över
  # SSH (fjärrvärdar/rootless Docker), protobufjs av docker-modem. Bara
  # byggskript, körs aldrig av applikationskoden.
  ssh2: true
  cpu-features: true
  protobufjs: true
  # Transitivt via @auth0/auth0-spa-js (apps/web, Fas 5: inloggning vid
  # checkout). Dess postinstall-skript gör bara console.log av ett
  # projekt-reklammeddelande — verifierat i scripts/postinstall.js,
  # ingen kompilering eller nätverksanrop.
  browser-tabs-lock: true
  # Transitivt via @pact-foundation/pact (kontraktstester, docs/plan.md 7.9). Har bara ett
  # postinstall-skript för anonym användningstelemetri och behövs inte, så det körs aldrig.
  '@scarf/scarf': false
minimumReleaseAgeExclude:
  - '@tanstack/query-core@5.104.5'
  - '@tanstack/react-query@5.104.5'
  - '@typescript-eslint/eslint-plugin@8.72.0'
  - '@typescript-eslint/parser@8.72.0'
  - '@typescript-eslint/project-service@8.72.0'
  - '@typescript-eslint/scope-manager@8.72.0'
  - '@typescript-eslint/tsconfig-utils@8.72.0'
  - '@typescript-eslint/type-utils@8.72.0'
  - '@typescript-eslint/types@8.72.0'
  - '@typescript-eslint/typescript-estree@8.72.0'
  - '@typescript-eslint/utils@8.72.0'
  - '@typescript-eslint/visitor-keys@8.72.0'
  - typescript-eslint@8.72.0
