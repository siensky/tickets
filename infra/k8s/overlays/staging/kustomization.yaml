# Platshållare — ingen pipeline använder den här overlayn ännu.
# docs/plan.md beskriver bara "push till main → deploy", utan ett
# separat staging-steg; den här finns för att repo-strukturen ska vara
# komplett från dag ett (rules.md §10) och för att kunna testa ett
# manifest lokalt (kubectl kustomize infra/k8s/overlays/staging) innan
# det når produktion.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
