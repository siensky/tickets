# Fas 1 byggde booking-api + Postgres (båda shards, tomt schema). Fas 3
# lägger till Redis + RabbitMQ (väntrum/queue, outbox-relay) och de fyra
# nya tjänsterna (docs/plan.md "Fasplan").
#
# migrations/job.yaml ingår MEDVETET inte här — Jobs är immutabla i
# Kubernetes, så att låta Kustomize hantera det skulle krascha vid varje
# omdeploy (samma Job-namn, nytt image-tag, ingen patch tillåten på ett
# redan skapat Job). Jobbet appliceras separat av deploy-workflowen,
# med "kubectl delete --ignore-not-found" före varje ny körning.
#
# Dockerfiles + deploy.yml bygger/pushar/rullar nu ut samtliga fem
# tjänster. Fyra nya GitHub-secrets krävs för att "Create/update app
# secrets"-steget ska lyckas — se docs/runbook.md "Nödvändiga GitHub
# Actions-secrets".
#
# Fas 6 (docs/plan.md "Autoscaling"/"Zero-downtime"): HPA på
# booking-api/realtime-gateway, KEDA ScaledObject + TriggerAuthentication
# på notification-worker, PodDisruptionBudget på de två enreplikstjänsterna
# (scheduler-worker, payment-mock). Förutsätter att KEDA-operatorn redan
# är installerad (infra/terraform/helm.tf) — annars avvisar klustret
# `ScaledObject`/`TriggerAuthentication` som okända CRD:er.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespaces/namespaces.yaml
  - postgres-shard-0/statefulset.yaml
  - postgres-shard-0/service.yaml
  - postgres-shard-1/statefulset.yaml
  - postgres-shard-1/service.yaml
  - redis/statefulset.yaml
  - redis/service.yaml
  - rabbitmq/statefulset.yaml
  - rabbitmq/service.yaml
  - booking-api/deployment.yaml
  - booking-api/service.yaml
  - booking-api/ingress.yaml
  - booking-api/ingress-loadtest.yaml
  - booking-api/hpa.yaml
  - realtime-gateway/deployment.yaml
  - realtime-gateway/service.yaml
  - realtime-gateway/hpa.yaml
  - scheduler-worker/deployment.yaml
  - scheduler-worker/service.yaml
  - scheduler-worker/pdb.yaml
  - notification-worker/deployment.yaml
  - notification-worker/service.yaml
  - notification-worker/scaledobject.yaml
  - payment-mock/deployment.yaml
  - payment-mock/service.yaml
  - payment-mock/pdb.yaml
  # Fas 4 (docs/plan.md "Observability"/"Backups"). Kräver att Terraform
  # (infra/terraform/observability.tf) redan har skapat namnrymden
  # "observability" och Prometheus Operators CRD:er (kube-prometheus-stack)
  # — samma ordning som cert-manager/ClusterIssuers sedan Fas 1.
  - monitoring/servicemonitors.yaml
  - monitoring/prometheusrule.yaml
  - monitoring/dashboards.yaml
  - backup/cronjob.yaml
