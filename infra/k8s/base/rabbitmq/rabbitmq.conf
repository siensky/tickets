# Läses av mäklaren som /etc/rabbitmq/conf.d/20-tickets.conf (docs/plan.md 8.6).
#
# Policyerna (dead-letter per konsumentkö) i definitions.json importeras av statefulsetens postStart-hook mot den
# KÖRANDE mäklaren (`rabbitmqctl import_definitions`), inte med `load_definitions`: det senare körs före
# standardvhosten "/" och standardanvändaren finns och kraschar bootsekvensen ("Please create virtual host /
# prior to importing definitions", verifierat). En policy kan sättas på en redan skapad kö; en köes argument kan
# inte ändras efter att den skapats (PRECONDITION_FAILED), därför policy.

# Utan detta aggregerar rabbitmq_prometheus bort kömåtten per kö, och larmet på dödköerna (queue=~".*\.dead")
# får inga serier och blir tyst. Få köer, så kardinaliteten är liten.
prometheus.return_per_object_metrics = true
