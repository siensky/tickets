# docs/plan.md "Tjänster": egen tjänst så en booking-api-deploy aldrig
# tappar WebSocket-anslutningar. HPA (vila 2, topp 4, minnesbaserad —
# hpa.yaml) äger replikantalet — MEDVETET inget `spec.replicas` här, se
# booking-api/deployment.yaml:s kommentar för varför (annars skriver
# VARJE `kubectl apply` tillbaka ett statiskt tal över HPA:ns löpande
# beslut, inte bara en engångsdipp).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: realtime-gateway
  namespace: ticketing
  labels:
    app: realtime-gateway
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: realtime-gateway
  template:
    metadata:
      labels:
        app: realtime-gateway
    spec:
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: realtime-gateway
      containers:
        - name: realtime-gateway
          image: ghcr.io/siensky/tickets/realtime-gateway:latest
          ports:
            - containerPort: 3001
              name: http
          env:
            - name: NODE_ENV
              value: production
            - name: REALTIME_GATEWAY_PORT
              value: '3001'
            - name: REDIS_URL
              value: 'redis://redis.data.svc.cluster.local:6379'
            # Se infra/k8s/base/booking-api/deployment.yaml för varför det
            # är `tickets-generated-secrets`, inte `tickets-app-secrets`.
            - name: QUEUE_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: tickets-generated-secrets
                  key: queue-token-secret
          resources:
            requests:
              # Sänkt från 250m (docs/loadtest-cpu-plan.md steg 5): gatewayen är minnesbunden och skalar på
              # minne (hpa.yaml), och 250m reserverade CPU som booking-api behövde för att kunna skala.
              # Mätt i vila: cirka 6m per podd.
              cpu: 100m
              # Höjt från 256Mi (Fas 6-reviewn, då med OTel-instrumentering,
              # som numera är borttagen): en Node 22-process låg nära 70 % av
              # 256Mi i vila, vilket hade kunnat trigga HPA:n (hpa.yaml)
              # till max direkt utan en riktig kurva. OVERIFIERAT mot en
              # riktig podd (ingen Tailscale-åtkomst i byggmiljön, samma
              # begränsning som Fas 4:s observability) — mät faktisk
              # RSS i vila vid första riktiga deploy och justera.
              memory: 320Mi
            limits:
              cpu: 500m
              memory: 640Mi
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              # Extra god tid jämfört med booking-api: WS-klienter som
              # återansluter med backoff (docs/plan.md "Realtid") ska
              # hinna märka att podden går ur rotation.
              exec:
                command: ['sh', '-c', 'sleep 5']
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
