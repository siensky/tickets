# docs/plan.md "Observability": scheduler-worker körs utan Service hittills
# (probes pekar på podd-IP) — Fas 4s ServiceMonitor (infra/k8s/base/
# monitoring) behöver en Service att selektera mot.
apiVersion: v1
kind: Service
metadata:
  name: scheduler-worker
  namespace: ticketing
  labels:
    app: scheduler-worker
spec:
  selector:
    app: scheduler-worker
  ports:
    - port: 80
      targetPort: http
      name: http
