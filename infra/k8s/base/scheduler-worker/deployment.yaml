# docs/plan.md "Zero-downtime": `replicas: 1` med RollingUpdate har
# `maxSurge: 25%` som avrundas uppåt till 1 — två schemaläggare hade
# då kunnat köra samtidigt under varje deploy, exakt det Postgres
# advisory-locket i src/index.ts redan skyddar mot, men korrektheten ska
# inte vila på Kubernetes ensamt. `strategy: Recreate` tar bort den
# gamla podden FÖRST.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler-worker
  namespace: ticketing
  labels:
    app: scheduler-worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: scheduler-worker
  template:
    metadata:
      labels:
        app: scheduler-worker
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: scheduler-worker
          image: ghcr.io/siensky/tickets/scheduler-worker:latest
          ports:
            - containerPort: 3010
              name: http
          env:
            - name: NODE_ENV
              value: production
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: 'http://alloy.observability.svc.cluster.local:4318/v1/traces'
            - name: SCHEDULER_WORKER_PORT
              value: '3010'
            - name: PGPASSWORD_SHARD_0
              valueFrom:
                secretKeyRef:
                  name: postgres-shard-0-credentials
                  key: password
            - name: PGPASSWORD_SHARD_1
              valueFrom:
                secretKeyRef:
                  name: postgres-shard-1-credentials
                  key: password
            - name: DATABASE_URL_SHARD_0
              value: 'postgresql://postgres:$(PGPASSWORD_SHARD_0)@postgres-shard-0.data.svc.cluster.local:5432/tickets'
            - name: DATABASE_URL_SHARD_1
              value: 'postgresql://postgres:$(PGPASSWORD_SHARD_1)@postgres-shard-1.data.svc.cluster.local:5432/tickets'
            - name: REDIS_URL
              value: 'redis://redis.data.svc.cluster.local:6379'
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: password
            - name: RABBITMQ_URL
              value: 'amqp://app:$(RABBITMQ_PASSWORD)@rabbitmq.data.svc.cluster.local:5672'
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
