apiVersion: v1
kind: Service
metadata:
  name: postgres-shard-0
  namespace: data
  labels:
    app: postgres-shard-0
    component: postgres
spec:
  clusterIP: None # headless — StatefulSet-standard, varje podd får ett stabilt DNS-namn
  selector:
    app: postgres-shard-0
  ports:
    - port: 5432
      targetPort: 5432
    - port: 9187
      targetPort: 9187
      name: metrics
