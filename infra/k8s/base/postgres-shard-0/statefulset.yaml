# docs/plan.md "Databas": två Postgres-poddar, shard-nyckel event_id.
# docs/forsvar.md "Varför nätverksvolymer": storageClassName skrivs ut
# explicit (hcloud-volumes, Hetzner CSI) — k3s default local-path binder
# volymen till noden, vilket gör failover-demon till ett avbrottstest.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-shard-0
  namespace: data
  labels:
    app: postgres-shard-0
    shard: '0'
spec:
  serviceName: postgres-shard-0
  replicas: 1
  selector:
    matchLabels:
      app: postgres-shard-0
  template:
    metadata:
      labels:
        app: postgres-shard-0
        shard: '0'
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_DB
              value: tickets
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-shard-0-credentials
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            exec:
              command: ['pg_isready', '-U', 'postgres']
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ['pg_isready', '-U', 'postgres']
            initialDelaySeconds: 15
            periodSeconds: 20
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ['ReadWriteOnce']
        storageClassName: hcloud-volumes
        resources:
          requests:
            storage: 10Gi
