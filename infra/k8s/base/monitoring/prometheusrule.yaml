# docs/plan.md "Observability": "Ett larm triggas medvetet under demon."
# HighErrorRate och PostgresDown är de två enklast att utlösa på kommando
# (döda en postgres-podd, eller skala booking-api till 0 ett ögonblick) —
# se docs/runbook.md "Vanliga larm och vad de betyder".
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: tickets-alerts
  namespace: ticketing
spec:
  groups:
    - name: tickets.rules
      rules:
        - alert: HighErrorRate
          expr: |
            sum(rate(http_requests_total{status=~"5.."}[5m])) by (service)
              / sum(rate(http_requests_total[5m])) by (service) > 0.05
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: '{{ $labels.service }} har >5% felfrekvens'
            description: '{{ $labels.service }}: {{ $value | humanizePercentage }} av requests svarar 5xx över 5 minuter.'

        - alert: PostgresDown
          expr: pg_up == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: 'Postgres-shard nere'
            description: 'pg_up == 0 för {{ $labels.instance }} — postgres-exporter når inte databasen.'

        - alert: RabbitMQQueueDepthHigh
          expr: rabbitmq_queue_messages_ready{queue!~".+\\.dead"} > 900
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: 'Ködjup nära KEDAs skalningstak'
            description: '{{ $labels.queue }} har {{ $value }} väntande meddelanden — KEDA skalar notification-worker på just detta mått, taket är 100/podd * 10 poddar (docs/plan.md "Autoscaling").'

        # docs/plan.md 8.6: ett meddelande som överskrider x-delivery-limit hamnar i <kö>.dead i stället för att
        # försvinna. Kräver prometheus.return_per_object_metrics (rabbitmq.conf), annars finns ingen serie per kö.
        - alert: RabbitMQDeadLetters
          expr: rabbitmq_queue_messages_ready{queue=~".+\\.dead"} > 0
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: 'Döda meddelanden i RabbitMQ'
            description: '{{ $labels.queue }} innehåller {{ $value }} meddelanden som överskred delivery-limit. Se docs/runbook.md "RabbitMQ: döda meddelanden".'

        # Policyn importeras av postStart-hooken (statefulset.yaml). Saknas dödköerna helt har importen eller
        # måttet (rabbitmq.conf) fallerat och RabbitMQDeadLetters ovan är då tyst.
        - alert: RabbitMQDeadLetterPolicyMissing
          expr: absent(rabbitmq_queue_messages_ready{queue=~".+\\.dead"})
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: 'Dödköerna saknas i RabbitMQ-måtten'
            description: 'Ingen *.dead-kö syns i Prometheus. Kontrollera att postStart-importen av definitions.json lyckades (kubectl logs -n data rabbitmq-0) och att per-kö-måtten är på.'

        # docs/plan.md 8.7: Tempo har ingen storleksbaserad retention, så PVC:n (5Gi) är taket. 10 % sampling och
        # 7 dagar ska rymmas gott och väl; fylls disken är det ett tecken på att samplingen är för hög.
        - alert: TempoVolumeFilling
          expr: kubelet_volume_stats_used_bytes{namespace="observability",persistentvolumeclaim=~".*tempo.*"} / kubelet_volume_stats_capacity_bytes{namespace="observability",persistentvolumeclaim=~".*tempo.*"} > 0.8
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: 'Tempos disk är över 80 % full'
            description: 'PVC {{ $labels.persistentvolumeclaim }} är {{ $value | humanizePercentage }} full. Sänk tempo_sampling_percentage eller stäng av Tempo (tempo_enabled = false).'

        - alert: PodCrashLooping
          expr: increase(kube_pod_container_status_restarts_total{namespace=~"ticketing|data"}[15m]) > 3
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: '{{ $labels.namespace }}/{{ $labels.pod }} startar om upprepat'
            description: '{{ $value }} omstarter av {{ $labels.container }} på 15 minuter.'

        # docs/plan.md 7.2: Loki gav 401 på varje batch utan att något larmade, och
        # noll loggar sparades i flera dagar. Mäter Alloys egna förlorade rader.
        - alert: AlloyLogEntriesDropped
          expr: sum(increase(loki_write_dropped_entries_total[10m])) by (pod) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: 'Alloy tappar loggrader'
            description: '{{ $labels.pod }} har tappat {{ $value }} loggrader mot Loki på 10 minuter — loggar sparas inte.'
