# docs/plan.md "Observability": Prometheus hämtar (pull) via ServiceMonitor-
# resurser. Dessa lever med applikationens egna manifest (kustomize),
# inte i Terraform — se infra/terraform/observability.tf. Kube-prometheus-
# stacks Prometheus är konfigurerad (observability.tf) att hitta
# ServiceMonitors i ALLA namnrymder, inte bara sin egen release.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: booking-api
  namespace: ticketing
spec:
  selector:
    matchLabels:
      app: booking-api
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: realtime-gateway
  namespace: ticketing
spec:
  selector:
    matchLabels:
      app: realtime-gateway
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: scheduler-worker
  namespace: ticketing
