---
# Ett ServiceMonitor för båda shardarna — "component: postgres" delas redan
# av deras Service-labels (samma label som StatefulSetens anti-affinitet).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: postgres
  namespace: data
spec:
  selector:
    matchLabels:
      component: postgres
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: redis
  namespace: data
spec:
  selector:
    matchLabels:
      app: redis
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
---
# rabbitmq_prometheus-pluginets eget /metrics (infra/k8s/base/rabbitmq/
# statefulset.yaml) — inte notification-workers egen ködjup-gauge, borttagen
# i Fas 4 (docs/plan.md "Fasplan" Fas 3-review-noten under Fas 4).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: rabbitmq
  namespace: data
spec:
  selector:
    matchLabels:
      app: rabbitmq
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
