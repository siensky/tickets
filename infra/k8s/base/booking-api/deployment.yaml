# docs/plan.md "Zero-downtime — kräver alla fyra": readinessProbe,
# maxUnavailable: 0, preStop-hook + terminationGracePeriodSeconds, och
# graceful shutdown i appen (redan byggt i src/index.ts — SIGTERM →
# app.close()). HPA (fas 6, hpa.yaml) äger replikantalet — MEDVETET
# inget `spec.replicas` här. Pipelinen deployar med `kubectl apply`:
# står fältet kvar skriver VARJE apply tillbaka det statiska talet över
# HPA:ns egna, aktuella beslut (Kubernetes' egen HPA-dokumentation,
# upptäckt i Fas 6-reviewn — en tidigare kommentar här hade resonemanget
# baklänges). Under en `deploy-under-load`-körning hade booking-api
# alltså skalats NER mitt i lasten vid varje ny deploy, precis det
# `maxUnavailable: 0` ska förhindra. Priset för att utelämna fältet är
# en engångs-dipp till Kubernetes' default (1 podd) vid just DEN apply
# som först tar bort fältet — HPA:ns `minReplicas: 2` tar över inom
# sekunder, och det händer bara en gång (nu), inte vid varje framtida
# deploy.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-api
  namespace: ticketing
  labels:
    app: booking-api
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: booking-api
  template:
    metadata:
      labels:
        app: booking-api
    spec:
      terminationGracePeriodSeconds: 30
      # B16: utan den här kan båda replikerna hamna på samma nod på ett
      # 2-nodskluster — "whenUnsatisfiable: ScheduleAnyway" (inte
      # DoNotSchedule) eftersom en hård spridning plus maxUnavailable: 0
      # på bara två noder hade kunnat låsa rollouten helt om en nod
      # tillfälligt saknar kapacitet.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: booking-api
      # ghcr.io-paket pushade med GITHUB_TOKEN är privata som default —
      # secreten skapas/uppdateras av deploy.yml vid varje körning.
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: booking-api
          image: ghcr.io/siensky/tickets/booking-api:latest
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_ENV
              value: production
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: 'http://alloy.observability.svc.cluster.local:4318/v1/traces'
            - name: BOOKING_API_PORT
              value: '3000'
            - name: PGPASSWORD_SHARD_0
              valueFrom:
                secretKeyRef:
                  name: postgres-shard-0-credentials
                  key: password
            - name: PGPASSWORD_SHARD_1
              valueFrom:
                secretKeyRef:
                  name: postgres-shard-1-credentials
                  key: password
            - name: DATABASE_URL_SHARD_0
              value: 'postgresql://postgres:$(PGPASSWORD_SHARD_0)@postgres-shard-0.data.svc.cluster.local:5432/tickets'
            - name: DATABASE_URL_SHARD_1
              value: 'postgresql://postgres:$(PGPASSWORD_SHARD_1)@postgres-shard-1.data.svc.cluster.local:5432/tickets'
            - name: REDIS_URL
              value: 'redis://redis.data.svc.cluster.local:6379'
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: password
            - name: RABBITMQ_URL
              value: 'amqp://app:$(RABBITMQ_PASSWORD)@rabbitmq.data.svc.cluster.local:5672'
            - name: RATE_LIMIT_PER_SECOND
              value: '50'
            - name: PAYMENT_FROZEN_MINUTES
              value: '10'
            # docs/plan.md "Klienter": appen och API:et är alltid olika
            # origin (tikknet.se vs api.tikknet.se) — utan detta blockerar
            # webbläsaren varje svar till PWA:n.
            - name: CORS_ALLOWED_ORIGINS
              value: 'https://tikknet.se'
            # Inte hemliga — rena URL:er. Byts till apps/webs riktiga
            # domän den dagen fas 5 bygger PWA:n.
            - name: CHECKOUT_SUCCESS_URL
              value: 'https://tikknet.se/checkout/success'
            - name: CHECKOUT_CANCEL_URL
              value: 'https://tikknet.se/checkout/cancel'
            # docs/plan.md "Secrets": GitHub Actions secrets → Kubernetes
            # Secret vid deploy. `tickets-app-secrets` kommer från RIKTIGA
            # externa konton (Auth0/Stripe) — skrivs över vid VARJE deploy
            # (samma mönster som ghcr-pull-secret), så en roterad nyckel i
            # GitHub alltid speglas. `tickets-generated-secrets` är
            # egengenererade (samma mönster som postgres-credentials) —
            # skapas EN gång, rörs aldrig igen (annars ogiltigförklaras
            # redan utfärdade kötoken/QR-koder). Se .github/workflows/deploy.yml.
            - name: AUTH0_DOMAIN
              valueFrom:
                secretKeyRef:
                  name: tickets-app-secrets
                  key: auth0-domain
            - name: AUTH0_AUDIENCE
              valueFrom:
                secretKeyRef:
                  name: tickets-app-secrets
                  key: auth0-audience
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: tickets-app-secrets
                  key: stripe-secret-key
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: tickets-app-secrets
                  key: stripe-webhook-secret
            - name: QUEUE_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: tickets-generated-secrets
                  key: queue-token-secret
            - name: QR_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: tickets-generated-secrets
                  key: qr-token-secret
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              # docs/forsvar.md "Varför kräver zero-downtime fyra saker?":
              # ingress-nginx vet inte omedelbart att podden ska dö — ge
              # den tid att tas ur rotation innan processen får SIGTERM.
              exec:
                command: ['sh', '-c', 'sleep 5']
          securityContext:
            runAsNonRoot: true
            # Numerisk, matchar "USER 10001" i Dockerfilen. Utan den här
            # raden måste kubelet slå upp namnet "app" mot imagens
            # /etc/passwd för att bevisa icke-root, vilket det INTE klarar
            # med Alpines musl libc i vissa k3s/containerd-kombinationer —
            # explicit UID gör introspektionen onödig helt och hållet.
            runAsUser: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
