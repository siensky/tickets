# docs/plan.md "Certifikat — DNS-01, och staging först": letsencrypt-staging
# tills kedjan är stabil, byt till letsencrypt-production en gång
# (cert-manager.io/cluster-issuer-annotationen nedan).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: booking-api
  namespace: ticketing
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.tikknet.se
      secretName: booking-api-tls
  rules:
    - host: api.tikknet.se
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: booking-api
                port:
                  number: 80
