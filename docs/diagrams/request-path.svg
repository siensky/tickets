<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 500" width="1800" height="500" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="r-black" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
    <marker id="r-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f8f3e"/></marker>
    <style>
      .t { font-size: 15px; font-weight: 700; fill: #1d2128; text-anchor: middle; }
      .s { font-size: 11.5px; fill: #3b4150; text-anchor: middle; }
      .l { font-size: 10.5px; fill: #555b66; }
      .v { font-size: 11.5px; fill: #3b4150; }
    </style>
  </defs>
  <rect width="1800" height="500" fill="#ffffff"/>
  <text x="40" y="38" font-size="20" font-weight="700" fill="#1d2128">Från webbläsare till databas</text>

  <!-- Huvudvägen -->
  <rect x="40" y="110" width="180" height="110" rx="10" fill="#fdf0c2" stroke="#d4a72c" stroke-width="1.5"/>
  <text x="130" y="148" class="t">Webbläsare</text>
  <text x="130" y="170" class="s">React-appen körs här</text>
  <text x="130" y="187" class="s">anropar api.tikknet.se</text>

  <rect x="280" y="110" width="200" height="110" rx="10" fill="#eceef1" stroke="#8a8f98" stroke-width="1.5"/>
  <text x="380" y="148" class="t">Cloudflare</text>
  <text x="380" y="170" class="s">TLS · DDoS-skydd</text>
  <text x="380" y="187" class="s">döljer serverns IP</text>

  <rect x="540" y="110" width="200" height="110" rx="10" fill="#eceef1" stroke="#8a8f98" stroke-width="1.5"/>
  <text x="640" y="148" class="t">ingress-nginx</text>
  <text x="640" y="170" class="s">en podd per nod</text>
  <text x="640" y="187" class="s">DNS round-robin, ingen LB</text>

  <rect x="800" y="110" width="180" height="110" rx="10" fill="#eef3fb" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="890" y="148" class="t">Service</text>
  <text x="890" y="170" class="s">booking-api</text>
  <text x="890" y="187" class="s">fördelar på ≥ 2 poddar</text>

  <rect x="1040" y="110" width="270" height="110" rx="10" fill="#dde8f6" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="1175" y="142" class="t">booking-api-podd</text>
  <text x="1175" y="163" class="s">rate limit · Zod-validering · kötoken</text>
  <text x="1175" y="180" class="s">controller → service → repository</text>
  <text x="1175" y="197" class="s">SQL finns bara i repository</text>

  <rect x="1370" y="110" width="160" height="110" rx="10" fill="#ece1f5" stroke="#8e5bb5" stroke-width="1.5"/>
  <text x="1450" y="148" class="t">shard-router</text>
  <text x="1450" y="170" class="s">md5(event_id) % 2</text>
  <text x="1450" y="187" class="s">väljer databas</text>

  <path d="M1590,62 a90,10 0 0 0 180,0 V138 a90,10 0 0 1 -180,0 Z" fill="#dcecd5" stroke="#5c9a4a" stroke-width="1.5"/>
  <ellipse cx="1680" cy="62" rx="90" ry="10" fill="#e6f2e0" stroke="#5c9a4a" stroke-width="1.5"/>
  <text x="1680" y="98" class="t">Postgres shard-0</text>
  <text x="1680" y="118" class="s">+ globala tabeller</text>

  <path d="M1590,202 a90,10 0 0 0 180,0 V278 a90,10 0 0 1 -180,0 Z" fill="#dcecd5" stroke="#5c9a4a" stroke-width="1.5"/>
  <ellipse cx="1680" cy="202" rx="90" ry="10" fill="#e6f2e0" stroke="#5c9a4a" stroke-width="1.5"/>
  <text x="1680" y="238" class="t">Postgres shard-1</text>
  <text x="1680" y="258" class="s">eventets egna rader</text>

  <g fill="none" stroke-width="1.6">
    <path d="M220,165 H280" stroke="#222" marker-end="url(#r-black)"/>
    <path d="M480,165 H540" stroke="#222" marker-end="url(#r-black)"/>
    <path d="M740,165 H800" stroke="#222" marker-end="url(#r-black)"/>
    <path d="M980,165 H1040" stroke="#222" marker-end="url(#r-black)"/>
    <path d="M1310,165 H1370" stroke="#4f8f3e" marker-end="url(#r-green)"/>
    <path d="M1530,165 H1560 V100 H1590" stroke="#4f8f3e" marker-end="url(#r-green)"/>
    <path d="M1560,165 V240 H1590" stroke="#4f8f3e" marker-end="url(#r-green)"/>
    <path d="M1175,220 V330" stroke="#4f8f3e" marker-end="url(#r-green)"/>
    <path d="M130,220 V380 H280" stroke="#222" marker-end="url(#r-black)"/>
  </g>
  <text x="250" y="156" class="l" text-anchor="middle">HTTPS</text>
  <text x="510" y="156" class="l" text-anchor="middle">→ nod</text>
  <text x="1185" y="280" class="l">kö, rate limit, platsstatus-cache</text>
  <text x="140" y="300" class="l">hämtar appen</text>
  <text x="140" y="314" class="l">(statiska filer)</text>

  <!-- Under huvudvägen -->
  <rect x="280" y="330" width="200" height="100" rx="10" fill="#dcecd5" stroke="#5c9a4a" stroke-width="1.5"/>
  <text x="380" y="364" class="t">R2 via Worker</text>
  <text x="380" y="386" class="s">webbapp, scanner, bilder</text>
  <text x="380" y="403" class="s">tikknet.se · scan. · cdn.</text>

  <path d="M1040,342 a135,12 0 0 0 270,0 V418 a135,12 0 0 1 -270,0 Z" fill="#dcecd5" stroke="#5c9a4a" stroke-width="1.5"/>
  <ellipse cx="1175" cy="342" rx="135" ry="12" fill="#e6f2e0" stroke="#5c9a4a" stroke-width="1.5"/>
  <text x="1175" y="380" class="t">Redis</text>
  <text x="1175" y="400" class="s">snabb hjälp, aldrig sanningen</text>

  <text x="40" y="475" class="v">Postgres är sanningen: Redis avgör aldrig om en plats får reserveras. En bokning stannar alltid i sitt events shard. De statiska filerna och databas-backuperna ligger i samma R2-bucket, och Workern har en vitlista över prefixen.</text>
</svg>
