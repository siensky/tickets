name: Test

# Återanvänds av både ci.yml (varje PR) och deploy.yml (push till main)
# — docs/rules.md §8: lint, typecheck, unit, integration i pipelinen.
on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # Verifierar att eslint-plugin-boundaries (rules.md §1: lagergränser)
      # faktiskt bevakar något. "pnpm lint" ovan passerar grönt även om
      # ingenting bevakas — noll fel ser likadant ut oavsett om det beror
      # på korrekt kod eller en obevakad regel. Se docs/forsvar.md "Varför
      # ett regressionstest för lagergränserna?".
      - name: Verify layer-boundary enforcement
        run: node scripts/verify-boundaries-enforcement.mjs

      # docs/phase-status.md: secretKeyRef mot en secret som bara finns i
      # en ANNAN namnrymd syns aldrig i "kubectl apply" — bara som
      # CreateContainerConfigError när kubelet faktiskt schemalägger
      # podden. Den klassen bugg smet igenom till produktion två gånger
      # under Fas 4 (postgres-shard-*-credentials, rabbitmq-credentials)
      # innan den hittades. Detta steg är en statisk kontroll, kräver
      # ingen klusteråtkomst.
      - name: Verify secret namespaces match their consumers
        run: node scripts/verify-secret-namespaces.mjs

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # cdn-Workerns vitlista är en säkerhetsgräns (bucketen innehåller backuper).
      # Ligger utanför turbo-paketen, därför ett eget steg (docs/plan.md 7.19).
      - name: cdn Worker tests
        run: pnpm exec vitest run infra/terraform/workers

      - name: Integration tests
        # Testcontainers kräver Docker, som finns förinstallerat på
        # GitHub-hostade ubuntu-körare — inget extra steg behövs.
        run: pnpm test:integration
