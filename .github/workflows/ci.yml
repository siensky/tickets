name: CI

# Körs på varje pull request och på push till alla grenar utom main —
# main har sin egen gate inbyggd i deploy.yml (docs/rules.md §12:
# "deploy-workflow triggas endast på push till main").
#
# "pull_request" och "push" (branches-ignore: main) triggar BÅDA för en
# push till en branch som redan har en öppen PR — utan concurrency-
# gruppen körs test.yml två gånger parallellt för samma commit. Ingen av
# jobben har sidoeffekter (bara lint/typecheck/test/build), så
# cancel-in-progress: true är ofarligt här — annat än i deploy.yml, som
# aldrig får avbrytas mitt i en migration.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  test:
    uses: ./.github/workflows/test.yml

  e2e:
    uses: ./.github/workflows/e2e.yml
    secrets: inherit

  # Server-side dry-run mot det RIKTIGA klustret (ingenting skrivs —
  # "--dry-run=server" ber API-servern validera och svara utan att
  # spara). docs/phase-status.md: ett fel som "spec.ports[0].name:
  # Required value" existerar bara i hur den riktiga API-servern
  # validerar ett schema — "kubectl kustomize" (ren rendering, ingen
  # validering) ser det aldrig, och det nådde produktion två gånger under
  # Fas 4 innan detta jobb fanns. Fångar INTE CreateContainerConfigError
  # (secret/image-user-fel) — de kräver att kubelet faktiskt schemalägger
  # podden, vilket "verify-secret-namespaces.mjs" (test.yml) och manuell
  # granskning täcker istället.
  k8s-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          tags: tag:ci

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Write kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > "$HOME/.kube/config"
          echo "KUBECONFIG=$HOME/.kube/config" >> "$GITHUB_ENV"

      - name: Dry-run the full production manifest set against the live API server
        run: kubectl kustomize infra/k8s/overlays/production | kubectl apply --dry-run=server -f -

  # Bygger (men pushar ALDRIG) samtliga Dockerfiles. Fyra nya
  # build-stegskedjor (pnpm deploy --prod, tsup-bundling, non-root-steg)
  # testades tidigare första gången på push: main — alltså EFTER merge,
  # under en deploy som redan är igång. En PR som bryter en Dockerfile
  # ska synas här, inte i produktionsdeployen.
  docker-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - dockerfile: services/booking-api/Dockerfile
            tag: booking-api
          - dockerfile: shared/db/Dockerfile
            tag: migrations
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.tag }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: ${{ matrix.tag }}:ci
          cache-from: type=gha,scope=${{ matrix.tag }}
          cache-to: type=gha,mode=max,scope=${{ matrix.tag }}
