name: Deploy

# docs/plan.md "Deploy": bygg image → GHCR → migrations-Job mot båda
# shardarna → kubectl apply → rollout status. Pipelinen avbryter deployen
# om migrationen misslyckas. Triggas ENDAST på push till main
# (docs/rules.md §12) — aldrig pull_request_target, så forkade PR:er kan
# inte nå secrets.
on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

# Två merges med några minuters mellanrum ger annars två parallella
# deploy-jobb. Det andra river migrations-Jobbet mitt i den förstas körning
# ("kubectl delete job migrations") — node-pg-migrates advisory lock
# skyddar bara mot samtidiga ANSLUTNINGAR, inte mot att podden dödas; låset
# släpps med anslutningen. cancel-in-progress: false — en halvkörd
# migration ska köras KLART, aldrig avbrytas, nästa push väntar i kö.
concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  IMAGE_BASE: ghcr.io/${{ github.repository }}

jobs:
  test:
    uses: ./.github/workflows/test.yml

  e2e:
    uses: ./.github/workflows/e2e.yml
    secrets: inherit

  # docs/plan.md 7.10: en matris bygger imagesen parallellt i stället för i
  # sekvens (~4–5 min → ~1–1,5 min). Cache-nyckeln är scopad per image, så en
  # cache-träff på en tjänst aldrig döljer en trasig build av en annan.
  # Alla ben skriver samma `sha`-output (GITHUB_SHA är lika för alla), så
  # "last one wins" på matrisoutputs är ofarligt här.
  build-and-push:
    needs: [test, e2e]
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.short }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: booking-api
            dockerfile: services/booking-api/Dockerfile
          - image: realtime-gateway
            dockerfile: services/realtime-gateway/Dockerfile
          - image: scheduler-worker
            dockerfile: services/scheduler-worker/Dockerfile
          - image: notification-worker
            dockerfile: services/notification-worker/Dockerfile
          - image: payment-mock
            dockerfile: services/payment-mock/Dockerfile
          - image: migrations
            dockerfile: shared/db/Dockerfile
    steps:
      - uses: actions/checkout@v5

      - id: sha
        run: echo "short=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/${{ matrix.image }}:${{ steps.sha.outputs.short }}
            ${{ env.IMAGE_BASE }}/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # docs/plan.md "Fas 5 — kända luckor": PWA:ns statiska filer delar
  # medvetet R2-bucketen med databas-backuperna (backup-r2-credentials,
  # prefix "frontend/" i stället för en egen bucket) — en egen bucket
  # vore renare men är inte prioriterat, flaggat i muntligt försvar som
  # en förbättring. `sync`, inte `copy`: gamla hashade asset-filer från
  # föregående build ska försvinna, inte samlas på hög i all evighet.
  deploy-frontend:
    needs: [test, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the web app
        env:
          VITE_API_BASE_URL: https://api.tikknet.se
          # Fas 5-reviewn flaggade detta som obyggt ("realtime-gateway
          # saknar ingress"), men det var redan löst sedan Fas 3:
          # infra/k8s/base/booking-api/ingress.yaml routar /ws till
          # realtime-gateway på SAMMA host (docs/plan.md "Trafikväg":
          # ingen egen WS-subdomän). Rättat i Fas 6 — se docs/plan.md
          # "Fas 5 — kända luckor".
          VITE_WS_BASE_URL: wss://api.tikknet.se
          VITE_AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN }}
          VITE_AUTH0_AUDIENCE: ${{ secrets.AUTH0_AUDIENCE }}
          VITE_AUTH0_CLIENT_ID: ${{ secrets.AUTH0_WEB_CLIENT_ID }}
        run: pnpm --filter @tickets/web run build

      - name: Upload static files to R2
        run: |
          docker run --rm -v "$PWD/apps/web/dist:/data" \
            -e RCLONE_CONFIG_R2_TYPE=s3 \
            -e RCLONE_CONFIG_R2_PROVIDER=Cloudflare \
            -e RCLONE_CONFIG_R2_ENV_AUTH=false \
            -e RCLONE_CONFIG_R2_ACCESS_KEY_ID="${{ secrets.R2_ACCESS_KEY_ID }}" \
            -e RCLONE_CONFIG_R2_SECRET_ACCESS_KEY="${{ secrets.R2_SECRET_ACCESS_KEY }}" \
            -e RCLONE_CONFIG_R2_ENDPOINT="${{ secrets.R2_ENDPOINT }}" \
            rclone/rclone:1.75.2 sync /data "r2:${{ secrets.R2_BUCKET }}/frontend/"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      SHA: ${{ needs.build-and-push.outputs.sha }}
    steps:
      - uses: actions/checkout@v5

      # Klustrets API exponeras aldrig publikt — se docs/forsvar.md
      # "Varför öppnas 6443 aldrig i den publika brandväggen?". Köraren
      # går med i samma tailnet som control-plane-noden under jobbets
      # livstid (ephemeral auth-nyckel, städas bort automatiskt).
      - uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          tags: tag:ci

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Write kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > "$HOME/.kube/config"
          echo "KUBECONFIG=$HOME/.kube/config" >> "$GITHUB_ENV"

      - name: Verify cluster connectivity
        run: kubectl get nodes

      - name: Create namespaces
        run: kubectl apply -f infra/k8s/base/namespaces/namespaces.yaml

      # GHCR-paketen är PUBLIKA (hittat live under ett lasttest: en
      # ghcr-pull-secret byggd på GITHUB_TOKEN upphör strax efter att DEN
      # körningen avslutas — HPA som skalade upp långt senare fick `403
      # Forbidden` på en redan utgången token, trots att paketet var
      # publikt, eftersom en NÄRVARANDE men ogiltig credential blockerar
      # anonym åtkomst i stället för att falla tillbaka till den). Ingen
      # pull-secret skapas längre — se infra/k8s/base/booking-api/
      # deployment.yaml för samma motivering.

      # Lösenorden genereras EN gång och lever bara i klustret — ingen
      # GitHub secret för dem. Rör aldrig en redan existerande secret
      # (skulle göra en redan körande Postgres onåbar).
      #
      # "hex", inte "base64": base64-alfabetet innehåller +, / och = —
      # alla tre betyder något särskilt i en "postgresql://user:PASS@host"
      # URI (/ bryter authority-delen, + läses som mellanslag av vissa
      # parsers). Jobbet bygger just en sådan URI (job.yaml). Samma
      # entropi (32 byte), bara ett alfabet utan specialtecken.
      - name: Ensure Postgres credentials exist
        run: |
          for shard in 0 1; do
            name="postgres-shard-${shard}-credentials"
            if ! kubectl get secret "$name" -n data >/dev/null 2>&1; then
              kubectl create secret generic "$name" -n data \
                --from-literal=password="$(openssl rand -hex 32)"
            fi
            # booking-api/notification-worker/scheduler-worker (namnrymden
            # "ticketing") läser samma lösenord via secretKeyRef för att
            # bygga sin DATABASE_URL — Secrets är namnrymdsscopade i
            # Kubernetes, så en kopia av SAMMA värde (inte en nyslumpad
            # egen) måste finnas i "ticketing" också, annars är det fel
            # lösenord mot en redan körande Postgres.
            password=$(kubectl get secret "$name" -n data -o jsonpath='{.data.password}' | base64 -d)
            kubectl create secret generic "$name" -n ticketing \
              --from-literal=password="$password" \
              --dry-run=client -o yaml | kubectl apply -f -
          done

      # Samma skäl som Postgres-lösenorden ovan — och framför allt INTE
      # standardkontot `guest`: RabbitMQ begränsar `guest` till anslutningar
      # från localhost som default (`loopback_users`), vilket hade stoppat
      # varje poddtill-podd-anslutning över klusternätet. Ett eget konto
      # (`app`) kringgår den begränsningen helt, i stället för att slå av
      # ett säkerhetsnät i rabbitmq.conf.
      - name: Ensure RabbitMQ credentials exist
        run: |
          if ! kubectl get secret rabbitmq-credentials -n data >/dev/null 2>&1; then
            kubectl create secret generic rabbitmq-credentials -n data \
              --from-literal=password="$(openssl rand -hex 32)"
          fi
          # booking-api/notification-worker/scheduler-worker (namnrymden
          # "ticketing") läser samma lösenord via secretKeyRef för att
          # bygga RABBITMQ_URL — samma skäl som Postgres-lösenorden ovan.
          #
          # "amqp-url" är till för KEDA (infra/k8s/base/notification-worker/
          # scaledobject.yaml): dess RabbitMQ-scaler vill ha en FÄRDIG
          # anslutningssträng via en TriggerAuthentication-secret, inte
          # bara lösenordet — KEDA läser Deployment-objektet via API:et
          # och kan inte lösa upp Kubernetes' egna `$(RABBITMQ_PASSWORD)`-
          # substitution som RABBITMQ_URL-env-variabeln använder. Samma
          # lösenord, bara i ett format KEDA kan använda direkt.
          password=$(kubectl get secret rabbitmq-credentials -n data -o jsonpath='{.data.password}' | base64 -d)
          kubectl create secret generic rabbitmq-credentials -n ticketing \
            --from-literal=password="$password" \
            --from-literal=amqp-url="amqp://app:${password}@rabbitmq.data.svc.cluster.local:5672" \
            --dry-run=client -o yaml | kubectl apply -f -

      # docs/plan.md "Fasplan" Fas 3 / "Secrets": GitHub Actions secrets →
      # Kubernetes Secret vid deploy. Fyra REPO-SECRETS måste finnas i
      # GitHub (Settings → Secrets and variables → Actions) innan detta
      # steg kan lyckas: AUTH0_DOMAIN, AUTH0_AUDIENCE, STRIPE_SECRET_KEY,
      # STRIPE_WEBHOOK_SECRET — docs/runbook.md. Skrivs över vid VARJE
      # körning (samma mönster som ghcr-pull-secret ovan), till skillnad
      # från Postgres-lösenorden: en roterad Stripe-nyckel i GitHub SKA
      # spegla sig i klustret nästa deploy, en Postgres-lösenordsändring
      # skulle göra en redan körande databas onåbar.
      - name: Create/update app secrets (Auth0 + Stripe)
        run: |
          kubectl create secret generic tickets-app-secrets -n ticketing \
            --from-literal=auth0-domain="${{ secrets.AUTH0_DOMAIN }}" \
            --from-literal=auth0-audience="${{ secrets.AUTH0_AUDIENCE }}" \
            --from-literal=stripe-secret-key="${{ secrets.STRIPE_SECRET_KEY }}" \
            --from-literal=stripe-webhook-secret="${{ secrets.STRIPE_WEBHOOK_SECRET }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      # Fas 4 (docs/plan.md "Backups"): R2-bucketen/kontot är inget klustret
      # äger (docs/runbook.md "R2 — backup-lagring"), så samma mönster som
      # Auth0/Stripe ovan — fyra REPO-SECRETS: R2_ACCESS_KEY_ID,
      # R2_SECRET_ACCESS_KEY, R2_ENDPOINT, R2_BUCKET.
      - name: Create/update backup secrets (R2)
        run: |
          kubectl create secret generic backup-r2-credentials -n data \
            --from-literal=access-key-id="${{ secrets.R2_ACCESS_KEY_ID }}" \
            --from-literal=secret-access-key="${{ secrets.R2_SECRET_ACCESS_KEY }}" \
            --from-literal=endpoint="${{ secrets.R2_ENDPOINT }}" \
            --from-literal=bucket="${{ secrets.R2_BUCKET }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      # Egna, slumpgenererade hemligheter (docs/plan.md "Väntrum"s
      # kötoken, "Databas"s qr_token) — ingen GitHub-secret för dem,
      # samma "skapa bara om den saknas"-princip som Postgres-lösenorden:
      # en ändring här ogiltigförklarar varje redan utfärdat kötoken och
      # QR-biljett.
      - name: Ensure generated app secrets exist
        run: |
          if ! kubectl get secret tickets-generated-secrets -n ticketing >/dev/null 2>&1; then
            kubectl create secret generic tickets-generated-secrets -n ticketing \
              --from-literal=queue-token-secret="$(openssl rand -hex 32)" \
              --from-literal=qr-token-secret="$(openssl rand -hex 32)" \
              --from-literal=payment-mock-webhook-secret="$(openssl rand -hex 32)"
          fi

      # Postgres, Redis och RabbitMQ (StatefulSets) måste finnas innan
      # migrations-Jobbet eller någon app-podd kan ansluta. Appliceras
      # direkt (inte via Kustomize-overlayn) så att applikationstjänsterna
      # inte av misstag rullas ut två gånger — en gång här med :latest,
      # en gång i "Deploy"-steget med rätt :sha. Helt idempotent: körs
      # steget igen senare via overlayn ändras inget.
      - name: Deploy data layer (Postgres, Redis, RabbitMQ)
        run: |
          kubectl apply -f infra/k8s/base/postgres-shard-0/statefulset.yaml \
                         -f infra/k8s/base/postgres-shard-0/service.yaml \
                         -f infra/k8s/base/postgres-shard-1/statefulset.yaml \
                         -f infra/k8s/base/postgres-shard-1/service.yaml \
                         -f infra/k8s/base/redis/statefulset.yaml \
                         -f infra/k8s/base/redis/service.yaml \
                         -f infra/k8s/base/rabbitmq/statefulset.yaml \
                         -f infra/k8s/base/rabbitmq/service.yaml
          kubectl rollout status statefulset/postgres-shard-0 -n data --timeout=180s
          kubectl rollout status statefulset/postgres-shard-1 -n data --timeout=180s
          kubectl rollout status statefulset/redis -n data --timeout=180s
          kubectl rollout status statefulset/rabbitmq -n data --timeout=180s

      # migrations/job.yaml ingår MEDVETET inte i Kustomize-basen (se
      # infra/k8s/base/kustomization.yaml) — Jobs är immutabla, så det
      # måste raderas och återskapas för hand vid varje deploy, med det
      # nya image-taggen insatt.
      - name: Run migrations
        run: |
          kubectl delete job migrations -n data --ignore-not-found --wait --cascade=foreground

          sed "s|:latest|:${SHA}|" infra/k8s/base/migrations/job.yaml > /tmp/migrations-job.yaml
          # kustomize normaliserar referenser och en bas kan skrivas om —
          # verifiera att sed:en verkligen bytte taggen, annars har vi
          # tyst applicerat ":latest" (och imagePullPolicy: Always kör då
          # vad som råkar ligga där, utan att något fel syns).
          grep -q "migrations:${SHA}" /tmp/migrations-job.yaml || {
            echo "Image-taggen byttes inte i migrations-Jobbet (väntade migrations:${SHA})" >&2
            exit 1
          }
          kubectl apply -f /tmp/migrations-job.yaml

          # Egen pollning i stället för "kubectl wait --for=condition=complete":
          # den ensam väntar ut hela 280s-timeouten även när Jobbet redan
          # har misslyckats (condition=Failed), för att den bara bevakar
          # Complete. Avbryt direkt när Failed=True, med loggarna kvar.
          complete=""
          for i in $(seq 1 56); do
            complete=$(kubectl get job/migrations -n data -o jsonpath='{.status.conditions[?(@.type=="Complete")].status}' 2>/dev/null)
            [ "$complete" = "True" ] && break
            failed=$(kubectl get job/migrations -n data -o jsonpath='{.status.conditions[?(@.type=="Failed")].status}' 2>/dev/null)
            if [ "$failed" = "True" ]; then
              echo "Migrations-Jobbet misslyckades:" >&2
              kubectl logs job/migrations -n data --tail=50 >&2
              exit 1
            fi
            sleep 5
          done
          if [ "$complete" != "True" ]; then
            echo "Migrations-Jobbet svarade inte inom tidsgränsen (280s)." >&2
            exit 1
          fi

      - name: Set image tags
        working-directory: infra/k8s/overlays/production
        run: |
          services="booking-api realtime-gateway scheduler-worker notification-worker payment-mock"
          sed_args=()
          for svc in $services; do
            sed_args+=(-e "s|/${svc}:latest|/${svc}:${SHA}|")
          done
          kubectl kustomize . | sed "${sed_args[@]}" > /tmp/manifests.yaml
          # Samma verifiering som migrations-Jobbet — se kommentaren där,
          # en gång per tjänst: en bild som "kustomize" skriver om eller en
          # sed som inte träffar ska stoppa deployen, inte tyst rulla ut
          # ":latest".
          for svc in $services; do
            grep -q "${svc}:${SHA}" /tmp/manifests.yaml || {
              echo "Image-taggen byttes inte för ${svc} (väntade ${svc}:${SHA})" >&2
              exit 1
            }
          done

      - name: Deploy
        run: kubectl apply -f /tmp/manifests.yaml

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/booking-api -n ticketing --timeout=180s
          kubectl rollout status deployment/realtime-gateway -n ticketing --timeout=180s
          kubectl rollout status deployment/scheduler-worker -n ticketing --timeout=180s
          kubectl rollout status deployment/notification-worker -n ticketing --timeout=180s
          kubectl rollout status deployment/payment-mock -n ticketing --timeout=180s
